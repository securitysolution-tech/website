name: Translation drift

# When a pull request changes the English dictionary but not the Arabic one, list the keys
# that changed, so the Arabic review is not forgotten. Advisory: it never blocks.
on:
  pull_request:
    paths:
      - src/i18n/en.ts

permissions:
  contents: read

jobs:
  compare:
    name: English changed, Arabic untouched?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # One comment on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Compare the dictionaries
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qx 'src/i18n/ar.ts'; then
            echo "arabic=changed" >> "$GITHUB_OUTPUT"
          else
            echo "arabic=untouched" >> "$GITHUB_OUTPUT"
            echo "keys=$(node scripts/i18n-diff.mjs "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
          fi

      - name: Point it out on the pull request
        if: steps.diff.outputs.arabic == 'untouched'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          KEYS: ${{ steps.diff.outputs.keys }}
        run: |
          list="$(printf '%s' "$KEYS" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log([...d.changed.map(k=>'- '+k), ...d.removed.map(k=>'- '+k+' (removed)')].join('\n') || '- (none)')")"
          gh pr comment "$PR" --body "$(printf 'The English dictionary changed and the Arabic one did not. Keys to review in `src/i18n/ar.ts`:\n\n%s' "$list")"
