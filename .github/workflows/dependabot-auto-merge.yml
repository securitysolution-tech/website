name: Dependabot auto-merge

# Merges Dependabot's patch and minor updates once the required checks pass; majors are left
# for a person. Inert until the repository allows auto-merge and main requires the checks
# (Settings, General, "Allow auto-merge"; branch protection on main). See the handbook roadmap.
on:
  pull_request:

permissions:
  contents: read

jobs:
  merge:
    name: Enable auto-merge for patch and minor updates
    if: github.actor == 'dependabot[bot]' && github.repository == 'securitysolution-tech/website'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Enable auto-merge on the pull request
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --rebase "$PR_URL"
